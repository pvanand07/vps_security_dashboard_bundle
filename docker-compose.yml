services:
  vps-security-dashboard:
    build: .
    container_name: vps-security-dashboard
    restart: unless-stopped
    ports:
      - "0.0.0.0:8090:8090"
    volumes:
      - vpsdash-data:/var/lib/vps-security-dashboard
      - /var/log:/var/log:ro
      - /run/fail2ban:/run/fail2ban
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/utmp:/app/host-utmp:ro
    read_only: true
    tmpfs:
      - /tmp
    user: root
    cap_drop:
      - ALL
    cap_add:
      - SYS_BOOT
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

volumes:
  vpsdash-data:
