services:
  vps-security-dashboard:
    build: .
    container_name: vps-security-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - vpsdash-data:/var/lib/vps-security-dashboard
      - /var/log:/var/log:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  vpsdash-data:
